name: Multiplatform Build & Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0 or 1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name || 'v1.0.0' }}
  APP_VERSION: ${{ inputs.version || github.ref_name || 'v1.0.0' }}

jobs:
  build-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Setup Signing Keystore
        id: sign_setup
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > composeApp/release.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secret provided, building unsigned..."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/composeApp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          APK_PATH=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "output/NullVP-${{ env.RELEASE_TAG }}-android.apk"
          else
            echo "ERROR: Release APK not found!"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Android
          path: output/*.apk

  build-linux:
    name: Linux DEB & AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev binutils curl unzip

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch Core Binaries (Xray & tun2socks)
        run: |
          mkdir -p bin
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v1.8.24/Xray-linux-64.zip"
          unzip -q -o xray.zip xray -d bin/
          rm -f xray.zip
          curl -L -o tun2socks.zip "https://github.com/xjasonlyu/tun2socks/releases/download/v2.5.2/tun2socks-linux-amd64.zip"
          unzip -q -o tun2socks.zip tun2socks-linux-amd64 -d bin/
          mv bin/tun2socks-linux-amd64 bin/tun2socks
          rm -f tun2socks.zip
          chmod +x bin/*

      - name: Build Linux DEB & AppImage
        run: |
          ./gradlew :composeApp:packageDeb :composeApp:packageAppImage :composeApp:createDistributable -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Package Linux Portable & Collect Artifacts
        run: |
          mkdir -p output
          DIST_DIR="composeApp/build/compose/binaries/main/app/NullVP"
          if [ -d "$DIST_DIR" ]; then
            mkdir -p "$DIST_DIR/bin"
            cp -f bin/xray "$DIST_DIR/bin/" 2>/dev/null || true
            cp -f bin/tun2socks "$DIST_DIR/bin/" 2>/dev/null || true
            tar -czf "output/NullVP-${{ env.RELEASE_TAG }}-linux-x86_64-portable.tar.gz" -C composeApp/build/compose/binaries/main/app NullVP
          fi
          # AppImage
          APPIMAGE=$(find composeApp/build/compose/binaries/main/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE" ]; then cp "$APPIMAGE" "output/NullVP-${{ env.RELEASE_TAG }}-linux-x86_64.AppImage"; fi
          # DEB
          DEB=$(find composeApp/build/compose/binaries/main/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB" ]; then cp "$DEB" "output/NullVP-${{ env.RELEASE_TAG }}-amd64.deb"; fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Linux
          path: output/*

  build-windows:
    name: Windows MSI & Portable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Windows Core Binaries (Xray, tun2socks, wintun)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v1.8.24/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray_tmp"
          Copy-Item "xray_tmp/xray.exe" -Destination "bin/xray.exe"
          Invoke-WebRequest -Uri "https://github.com/xjasonlyu/tun2socks/releases/download/v2.5.2/tun2socks-windows-amd64.zip" -OutFile "tun2socks.zip"
          Expand-Archive -Path "tun2socks.zip" -DestinationPath "tun_tmp"
          Copy-Item "tun_tmp/tun2socks-windows-amd64.exe" -Destination "bin/tun2socks.exe"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_tmp"
          Copy-Item "wintun_tmp/wintun/bin/amd64/wintun.dll" -Destination "bin/wintun.dll"

      - name: Build Windows MSI & Distributable
        shell: cmd
        run: |
          gradlew.bat :composeApp:packageMsi :composeApp:createDistributable -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Assemble Windows Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          # MSI Installer
          $msi = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination "output/NullVP-${{ env.RELEASE_TAG }}-setup.msi" }

          # Portable Package (includes bundled JRE, Xray, tun2socks, and wintun.dll)
          $dist = "composeApp/build/compose/binaries/main/app/NullVP"
          if (Test-Path $dist) {
            New-Item -ItemType Directory -Force -Path "$dist/bin"
            Copy-Item "bin/xray.exe" -Destination "$dist/bin/xray.exe" -ErrorAction SilentlyContinue
            Copy-Item "bin/tun2socks.exe" -Destination "$dist/bin/tun2socks.exe" -ErrorAction SilentlyContinue
            Copy-Item "bin/wintun.dll" -Destination "$dist/bin/wintun.dll" -ErrorAction SilentlyContinue
            Copy-Item "bin/wintun.dll" -Destination "$dist/wintun.dll" -ErrorAction SilentlyContinue
            Compress-Archive -Path "$dist\*" -DestinationPath "output/NullVP-${{ env.RELEASE_TAG }}-windows-x64-portable.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Windows
          path: output/*

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: |
          ./gradlew :composeApp:packageDmg -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Locate and Collect DMG
        run: |
          mkdir -p output
          DMG=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -n "$DMG" ]; then cp "$DMG" "output/NullVP-${{ env.RELEASE_TAG }}-macos.dmg"; fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-macOS
          path: output/*

  release:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NullVP ${{ env.RELEASE_TAG }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
