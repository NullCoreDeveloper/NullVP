name: Multiplatform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Signing Keystore
        id: sign_setup
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > composeApp/release.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secret provided, building unsigned..."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/composeApp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease --no-daemon -x test

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          APK_PATH=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output/NullVP-v1.0.0-android.apk
          else
            echo "ERROR: Release APK not found!"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Android
          path: output/NullVP-v1.0.0-android.apk

  build-linux:
    name: Linux DEB & AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev binutils

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux DEB & AppImage
        run: |
          ./gradlew :composeApp:packageDeb :composeApp:packageAppImage :composeApp:createDistributable --no-daemon -x test

      - name: Package Linux Portable & Collect Artifacts
        run: |
          mkdir -p output
          # AppImage
          APPIMAGE=$(find composeApp/build/compose/binaries/main/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE" ]; then cp "$APPIMAGE" output/NullVP-v1.0.0-linux-x86_64.AppImage; fi
          # DEB
          DEB=$(find composeApp/build/compose/binaries/main/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB" ]; then cp "$DEB" output/NullVP-v1.0.0-amd64.deb; fi
          # Portable tar.gz
          if [ -d "composeApp/build/compose/binaries/main/app/NullVP" ]; then
            tar -czf output/NullVP-v1.0.0-linux-x86_64-portable.tar.gz -C composeApp/build/compose/binaries/main/app NullVP
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Linux
          path: output/*

  build-windows:
    name: Windows MSI & Portable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Windows MSI & Distributable
        shell: cmd
        run: |
          gradlew.bat :composeApp:packageMsi :composeApp:createDistributable --no-daemon -x test

      - name: Assemble Windows Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          # MSI Installer
          $msi = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination "output/NullVP-v1.0.0-setup.msi" }

          # Portable Package (includes bundled JRE and runtime)
          $dist = "composeApp/build/compose/binaries/main/app/NullVP"
          if (Test-Path $dist) {
            # Copy wintun.dll next to NullVP.exe if present in repo
            if (Test-Path "bin/wintun.dll") {
              Copy-Item "bin/wintun.dll" -Destination "$dist"
            }
            Compress-Archive -Path "$dist\*" -DestinationPath "output/NullVP-v1.0.0-windows-x64-portable.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Windows
          path: output/*

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: |
          ./gradlew :composeApp:packageDmg --no-daemon -x test

      - name: Locate and Collect DMG
        run: |
          mkdir -p output
          DMG=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -n "$DMG" ]; then cp "$DMG" output/NullVP-v1.0.0-macos.dmg; fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-macOS
          path: output/*

  release:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

