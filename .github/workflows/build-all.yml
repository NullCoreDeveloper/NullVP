name: Multiplatform Build & Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0 or 1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name || 'v1.0.0' }}
  APP_VERSION: ${{ inputs.version || github.ref_name || 'v1.0.0' }}

jobs:
  build-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Setup Signing Keystore
        id: sign_setup
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > composeApp/release.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secret provided, building unsigned..."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/composeApp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          APK_PATH=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "output/NullVP-${{ env.RELEASE_TAG }}-android.apk"
          else
            echo "ERROR: Release APK not found!"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Android
          path: output/*.apk

  build-linux:
    name: Linux DEB & AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev binutils curl unzip

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Linux Core Binaries (Custom Xray, nullvp-core, tun2socks)
        run: |
          mkdir -p bin
          if [ ! -f "bin/xray" ]; then
            GOBIN=$(pwd)/bin go install -ldflags="-s -w" github.com/xtls/xray-core/main@5ca6f4b7d4dc
            mv bin/main bin/xray
          fi
          if [ ! -f "bin/nullvp-core" ]; then
            cd core-bridge && go build -trimpath -ldflags="-s -w" -o ../bin/nullvp-core ./cmd/main.go && cd ..
          fi
          if [ ! -f "bin/tun2socks" ]; then
            curl -sL -o tun2socks.zip "https://github.com/xjasonlyu/tun2socks/releases/download/v2.5.2/tun2socks-linux-amd64.zip"
            unzip -q -o tun2socks.zip tun2socks-linux-amd64 -d bin/
            mv bin/tun2socks-linux-amd64 bin/tun2socks
            rm -f tun2socks.zip
          fi
          chmod +x bin/*

      - name: Build Linux Distributable
        run: |
          ./gradlew :composeApp:createDistributable -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Package Linux Artifacts (DEB, Portable, AppImage)
        run: |
          mkdir -p output
          DIST_DIR="composeApp/build/compose/binaries/main/app/NullVP"
          if [ -d "$DIST_DIR" ]; then
            mkdir -p "$DIST_DIR/bin"
            cp -f bin/xray "$DIST_DIR/bin/"
            cp -f bin/tun2socks "$DIST_DIR/bin/"
            cp -f bin/nullvp-core "$DIST_DIR/bin/" 2>/dev/null || true
            chmod +x "$DIST_DIR/bin"/*

            mkdir -p "$DIST_DIR/assets"
            cp -f composeApp/src/desktopMain/resources/assets/*.dat "$DIST_DIR/assets/" 2>/dev/null || true

            # 1. Portable tar.gz
            tar -czf "output/NullVP-${{ env.RELEASE_TAG }}-linux-x86_64-portable.tar.gz" -C composeApp/build/compose/binaries/main/app NullVP

            # 2. Standalone AppImage
            cp -f composeApp/src/desktopMain/resources/icon.png "$DIST_DIR/NullVP.png"

            printf '[Desktop Entry]\nType=Application\nName=NullVP\nComment=NullVP Cross-Platform Modern VPN Client\nExec=NullVP\nIcon=NullVP\nCategories=Network;\nTerminal=false\n' > "$DIST_DIR/NullVP.desktop"

            printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport APPDIR="${APPDIR:-$HERE}"\nexport PATH="${HERE}/bin:${PATH}"\ncd "${HERE}"\nexec "${HERE}/bin/NullVP" "$@"\n' > "$DIST_DIR/AppRun"
            chmod +x "$DIST_DIR/AppRun"

            curl -sL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
            chmod +x /tmp/appimagetool
            curl -sL "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" -o /tmp/runtime-x86_64

            ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run --runtime-file /tmp/runtime-x86_64 "$DIST_DIR" "output/NullVP-${{ env.RELEASE_TAG }}-linux-x86_64.AppImage"

            # 3. Clean Standard DEB Package with all binaries included
            DEB_BUILD="/tmp/nullvp-deb-pkg"
            rm -rf "$DEB_BUILD"
            mkdir -p "$DEB_BUILD/opt/NullVP"
            mkdir -p "$DEB_BUILD/usr/bin"
            mkdir -p "$DEB_BUILD/usr/share/applications"
            mkdir -p "$DEB_BUILD/usr/share/pixmaps"
            mkdir -p "$DEB_BUILD/DEBIAN"

            cp -a "$DIST_DIR"/* "$DEB_BUILD/opt/NullVP/"
            ln -sf /opt/NullVP/bin/NullVP "$DEB_BUILD/usr/bin/nullvp"
            cp -f composeApp/src/desktopMain/resources/icon.png "$DEB_BUILD/usr/share/pixmaps/nullvp.png"

            printf '[Desktop Entry]\nType=Application\nName=NullVP\nExec=/opt/NullVP/bin/NullVP %%u\nIcon=nullvp\nCategories=Network;VPN;\nTerminal=false\nComment=NullVP Cross-Platform Modern VPN Client\n' > "$DEB_BUILD/usr/share/applications/nullvp.desktop"

            PKG_VER=$(echo "${{ env.RELEASE_TAG }}" | sed 's/^v//')
            printf 'Package: nullvp\nVersion: %s\nSection: net\nPriority: optional\nArchitecture: amd64\nMaintainer: NullCoreDeveloper\nDescription: NullVP Cross-Platform Modern VPN Client\n' "$PKG_VER" > "$DEB_BUILD/DEBIAN/control"

            dpkg-deb --build "$DEB_BUILD" "output/NullVP-${{ env.RELEASE_TAG }}-amd64.deb"
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Linux
          path: output/*

  build-windows:
    name: Windows MSI & Portable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Windows Core Binaries (Custom Xray, nullvp-core, tun2socks, wintun)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          if (-not (Test-Path "bin/tun2socks.exe")) {
            Invoke-WebRequest -Uri "https://github.com/xjasonlyu/tun2socks/releases/download/v2.5.2/tun2socks-windows-amd64.zip" -OutFile "tun2socks.zip"
            Expand-Archive -Path "tun2socks.zip" -DestinationPath "tun_tmp"
            Copy-Item "tun_tmp/tun2socks-windows-amd64.exe" -Destination "bin/tun2socks.exe"
            Remove-Item -Force "tun2socks.zip"
          }
          if (-not (Test-Path "bin/wintun.dll")) {
            Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
            Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_tmp"
            Copy-Item "wintun_tmp/wintun/bin/amd64/wintun.dll" -Destination "bin/wintun.dll"
            Remove-Item -Force "wintun.zip"
          }

      - name: Build Windows MSI & Distributable
        shell: cmd
        run: |
          gradlew.bat :composeApp:packageMsi :composeApp:createDistributable -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Assemble Windows Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          # MSI Installer
          $msi = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination "output/NullVP-${{ env.RELEASE_TAG }}-setup.msi" }

          # Portable Package (includes bundled JRE, Xray, nullvp-core, tun2socks, and wintun.dll)
          $dist = "composeApp/build/compose/binaries/main/app/NullVP"
          if (Test-Path $dist) {
            New-Item -ItemType Directory -Force -Path "$dist/bin"
            Copy-Item "bin/xray.exe" -Destination "$dist/bin/xray.exe" -ErrorAction SilentlyContinue
            Copy-Item "bin/nullvp-core.exe" -Destination "$dist/bin/nullvp-core.exe" -ErrorAction SilentlyContinue
            Copy-Item "bin/tun2socks.exe" -Destination "$dist/bin/tun2socks.exe" -ErrorAction SilentlyContinue
            Copy-Item "bin/wintun.dll" -Destination "$dist/bin/wintun.dll" -ErrorAction SilentlyContinue
            Copy-Item "bin/wintun.dll" -Destination "$dist/wintun.dll" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path "$dist/assets"
            Copy-Item "composeApp/src/desktopMain/resources/assets/*.dat" -Destination "$dist/assets/" -ErrorAction SilentlyContinue
            Compress-Archive -Path "$dist\*" -DestinationPath "output/NullVP-${{ env.RELEASE_TAG }}-windows-x64-portable.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-Windows
          path: output/*

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: |
          ./gradlew :composeApp:packageDmg -PappVersion=${{ env.APP_VERSION }} --no-daemon -x test

      - name: Locate and Collect DMG
        run: |
          mkdir -p output
          DMG=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -n "$DMG" ]; then cp "$DMG" "output/NullVP-${{ env.RELEASE_TAG }}-macos.dmg"; fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullVP-macOS
          path: output/*

  release:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NullVP ${{ env.RELEASE_TAG }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
